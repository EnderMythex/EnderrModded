name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        env:
          # Lecture de revanced-patcher / revanced-library depuis GitHub Packages.
          # Si GITHUB_TOKEN ne suffit pas, crée un secret GPR_TOKEN (PAT avec read:packages).
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GPR_TOKEN || secrets.GITHUB_TOKEN }}
        run: ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: EnderrModded-debug
          path: app/build/outputs/apk/debug/*.apk
